<script>
  (function () {
    function ready(callback) {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', callback);
      } else {
        callback();
      }
    }

    function readerBody() {
      return document.body;
    }

    function detailUrl() {
      return '/comic/' + window.comicbasicData.comicid;
    }

    function jumpTo(url, message) {
      if (typeof clickToJump === 'function') {
        clickToJump(url, message);
        return;
      }
      window.location.href = url;
    }

    function scrollReaderTop(behavior) {
      window.scrollTo({ top: 0, left: 0, behavior: behavior || 'auto' });
      const pages = document.getElementById('maincomiccontainer');
      if (pages && typeof pages.scrollTo === 'function') {
        pages.scrollTo({ top: 0, left: 0, behavior: behavior || 'auto' });
      }
    }

    window.fetchData = async function fetchData(url) {
      try {
        const response = await fetch(url);
        if (!response.ok) {
          console.warn('TIBIU reader request failed:', response.status, url);
        }
      } catch (error) {
        console.error('TIBIU reader request failed:', error);
      }
    };

    window.nowread = function nowread() {
      const container = document.getElementById('chapterchoose');
      const target = container ? container.querySelector('.chapterchoosen') : null;
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    };

    window.clicktochange = function clicktochange() {
      const container = document.getElementById('chapterchoose');
      const sortButton = document.getElementById('chapterOrderToggle');
      if (!container) return;
      const nextOrder = container.getAttribute('data-order') === 'desc' ? 'asc' : 'desc';
      container.setAttribute('data-order', nextOrder);
      Array.from(container.children).reverse().forEach(function (chapter) {
        container.appendChild(chapter);
      });
      if (sortButton) {
        sortButton.textContent = nextOrder === 'desc' ? '正序' : '倒序';
      }
    };

    function setChapterDrawer(open) {
      const drawer = document.getElementById('novelReaderDrawer') || document.querySelector('.chapterlistinfo');
      if (!drawer) return;
      if (open) setReaderSetting(false);
      drawer.classList.toggle('is-open', !!open);
      drawer.setAttribute('aria-hidden', open ? 'false' : 'true');
      document.body.classList.toggle('novel-modal-open', !!open);
    }

    function setCommentListDrawer(open) {
      if (window.TibiuCommentDrawer) {
        if (open && typeof TibiuCommentDrawer.openList === 'function') {
          TibiuCommentDrawer.openList();
          return;
        }
        if (!open && typeof TibiuCommentDrawer.closeList === 'function') {
          TibiuCommentDrawer.closeList();
          return;
        }
      }
      const drawer = document.getElementById('comicReaderComments');
      const button = document.getElementById('commentbutton');
      if (!drawer) return;
      if (open) setReaderSetting(false);
      drawer.classList.toggle('is-open', !!open);
      drawer.setAttribute('aria-hidden', open ? 'false' : 'true');
      document.body.classList.toggle('is-comment-list-open', !!open);
      if (button) {
        button.classList.toggle('is-active', !!open);
      }
      if (open && typeof fetchcommentData === 'function') {
        fetchcommentData();
      }
    }

    function setReaderSetting(open) {
      const setting = document.getElementById('novelReaderSetting');
      const backdrop = document.getElementById('novelReaderSettingBackdrop');
      if (!setting) return;
      setting.classList.toggle('is-open', !!open);
      setting.setAttribute('aria-hidden', open ? 'false' : 'true');
      if (backdrop) {
        backdrop.classList.toggle('is-open', !!open);
        backdrop.setAttribute('aria-hidden', open ? 'false' : 'true');
      }
      document.body.classList.toggle('is-reader-setting-open', !!open);
    }

    function openComments(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      setCommentListDrawer(true);
    }

    window.checkCommentButtonSelected = openComments;
    window.openChapterCommentList = function openChapterCommentList() {
      setCommentListDrawer(true);
    };
    window.closeChapterCommentList = function closeChapterCommentList() {
      setCommentListDrawer(false);
    };

    window.clearComicLocalStorage = function clearComicLocalStorage() {
      const prefixes = ['comicidChapter_', '22comicInfo_', 'chapterPic_'];
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const key = localStorage.key(i);
        if (prefixes.some(function (prefix) { return key.indexOf(prefix) === 0; })) {
          localStorage.removeItem(key);
        }
      }
      if (window.TibiuUI && typeof TibiuUI.alert === 'function') {
        TibiuUI.alert({
          headline: '执行完毕',
          description: '已清理本地所有漫画缓存',
          confirmText: '刷新',
          onConfirm: function () { location.reload(); }
        });
      } else {
        location.reload();
      }
      if (typeof showNotification === 'function') {
        showNotification('info', '已清理本地漫画缓存');
      }
    };

    window.jumptochapter = function jumptochapter(button, direction) {
      if (button) button.loading = true;
      const currentId = String(window.comicbasicData.chapterid);
      const adjacentChapter = typeof findAdjacentChapter === 'function' ? findAdjacentChapter(currentId, direction) : null;
      const targetId = adjacentChapter ? adjacentChapter.id : null;
      if (!targetId) {
        const isPrev = direction === 'prev';
        if (window.TibiuUI && typeof TibiuUI.alert === 'function') {
          TibiuUI.alert({
            headline: isPrev ? '当前已是第一话' : '当前已是最后一话',
            description: isPrev ? '前面没有更早的章节了。' : '后面暂时没有更多章节了。',
            confirmText: 'OK'
          });
        } else if (typeof showNotification === 'function') {
          showNotification('info', isPrev ? '已是第一话' : '已是最后一话');
        }
        if (button) button.loading = false;
        return;
      }
      jumpTo('//' + window.comicbasicData.hostname + '/chapter/' + window.comicbasicData.comicid + '/' + targetId, '即将切换');
      if (button) button.loading = false;
    };

    function setToolsHidden(hidden) {
      const body = readerBody();
      body.classList.toggle('is-tools-hidden', !!hidden);
    }

    function demoteReaderAdOverlays() {
      const toolbar = document.querySelector('.novel-reader-toolbar');
      const toolbarRect = toolbar ? toolbar.getBoundingClientRect() : null;
      document.querySelectorAll('iframe[title="offer"]').forEach(function (iframe) {
        const holder = iframe.parentElement;
        if (!holder) return;
        const rect = iframe.getBoundingClientRect();
        const overlapsToolbar = !toolbarRect || (rect.bottom > toolbarRect.top && rect.top < toolbarRect.bottom);
        if (overlapsToolbar) {
          holder.style.setProperty('z-index', '90', 'important');
        }
      });
    }

    function watchReaderAdOverlays() {
      let queued = false;
      function queueDemote() {
        if (queued) return;
        queued = true;
        window.setTimeout(function () {
          queued = false;
          demoteReaderAdOverlays();
        }, 80);
      }
      queueDemote();
      [500, 1500, 3000].forEach(function (delay) {
        window.setTimeout(demoteReaderAdOverlays, delay);
      });
      if (typeof MutationObserver === 'function') {
        new MutationObserver(queueDemote).observe(document.body, { childList: true, subtree: true });
      }
      window.addEventListener('resize', queueDemote);
    }

    function syncReaderModeControls(mode) {
      const modeButton = document.getElementById('novelReaderFlipMode') || document.querySelector('[data-reader-mode-toggle]');
      const modeIcon = document.getElementById('novelReaderFlipIcon') || document.querySelector('.right-to-left-readMode-svg');
      const modeLabel = document.getElementById('novelReaderFlipLabel') || document.querySelector('[data-reader-mode-label]');
      const horizontal = mode === 'horizontal';
      if (modeButton) {
        modeButton.classList.toggle('is-active', horizontal);
        modeButton.setAttribute('aria-pressed', horizontal ? 'true' : 'false');
      }
      if (modeIcon) {
        modeIcon.setAttribute('name', horizontal ? 'readerHorizontal' : 'readerVertical');
      }
      if (modeLabel) {
        modeLabel.textContent = horizontal ? '左右' : '上下';
      }
    }

    function syncReaderDirectionControls(direction) {
      direction = direction === 'ltr' ? 'ltr' : 'rtl';
      document.querySelectorAll('[data-reader-direction]').forEach(function (button) {
        const active = button.getAttribute('data-reader-direction') === direction;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }

    function applyComicReaderDirection(direction) {
      direction = direction === 'ltr' ? 'ltr' : 'rtl';
      readerBody().setAttribute('data-reader-direction', direction);
      localStorage.setItem('tibiuComicReaderDirection', direction);
      syncReaderDirectionControls(direction);
      if (readerBody().getAttribute('data-reader-mode') === 'horizontal' && typeof resetReaderScroll === 'function') {
        window.requestAnimationFrame(resetReaderScroll);
      }
    }

    function applyReaderMode(mode) {
      const body = readerBody();
      mode = mode === 'horizontal' ? 'horizontal' : 'vertical';
      body.setAttribute('data-reader-mode', mode);
      body.setAttribute('data-flip-mode', mode);
      syncReaderModeControls(mode);
      if (mode === 'horizontal') {
        scrollReaderTop('auto');
      }
      document.dispatchEvent(new CustomEvent('tibiu:readmodechange', {
        detail: { horizontal: mode === 'horizontal' }
      }));
    }

    function toggleReaderMode() {
      const body = readerBody();
      const nextMode = body.getAttribute('data-reader-mode') === 'horizontal' ? 'vertical' : 'horizontal';
      localStorage.setItem('tibiuComicReaderMode', nextMode);
      applyReaderMode(nextMode);
    }

    function applySavedReaderMode() {
      const saved = localStorage.getItem('tibiuComicReaderMode') === 'horizontal' ? 'horizontal' : 'vertical';
      applyReaderMode(saved);
    }

    function applySavedReaderDirection() {
      const saved = localStorage.getItem('tibiuComicReaderDirection') === 'ltr' ? 'ltr' : 'rtl';
      applyComicReaderDirection(saved);
    }

    function applyComicReaderTheme(theme) {
      theme = theme || localStorage.getItem('tibiuComicReaderTheme') || 'default';
      if (theme !== 'white' && theme !== 'night') {
        theme = 'default';
      }
      if (theme === 'default') {
        readerBody().removeAttribute('data-theme');
        localStorage.removeItem('tibiuComicReaderTheme');
      } else {
        readerBody().setAttribute('data-theme', theme);
        localStorage.setItem('tibiuComicReaderTheme', theme);
      }
      document.querySelectorAll('[data-reader-theme]').forEach(function (button) {
        button.classList.toggle('is-active', button.getAttribute('data-reader-theme') === theme);
        button.setAttribute('aria-pressed', button.getAttribute('data-reader-theme') === theme ? 'true' : 'false');
      });
    }

    function setComicReaderFullscreen(enabled) {
      const body = readerBody();
      const button = document.querySelector('.full-screen-scale');
      const icon = document.querySelector('.fullcicon');
      body.classList.toggle('is-reader-fullscreen', !!enabled);
      body.classList.toggle('is-tools-hidden', !!enabled);
      if (button) {
        button.setAttribute('aria-pressed', enabled ? 'true' : 'false');
      }
      if (icon) {
        icon.setAttribute('name', enabled ? 'fullscreenExit' : 'fullscreen');
      }
      const setting = document.getElementById('novelReaderSetting');
      if (setting && enabled) {
        setReaderSetting(false);
      }
    }

    function toggleComicReaderFullscreen() {
      setComicReaderFullscreen(!readerBody().classList.contains('is-reader-fullscreen'));
    }

    function applyComicImageWidth(width) {
      const number = Math.max(540, Math.min(920, parseInt(width || '750', 10) || 750));
      readerBody().style.setProperty('--chapter-reader-max-width', number + 'px');
      localStorage.setItem('tibiuComicImageWidth', String(number));
      const range = document.getElementById('novelFontRange');
      if (range) range.value = number;
    }

    ready(function () {
      applyComicReaderTheme();
      applyComicImageWidth(localStorage.getItem('tibiuComicImageWidth') || '750');
      applySavedReaderDirection();
      applySavedReaderMode();

      document.querySelectorAll('[data-reader-back]').forEach(function (button) {
        button.addEventListener('click', function () {
          if (window.tibiuGoBack) {
            window.tibiuGoBack(detailUrl());
          } else {
            jumpTo(detailUrl(), '即将返回作品页');
          }
        });
      });
      document.querySelectorAll('[data-reader-home]').forEach(function (button) {
        button.addEventListener('click', function () { jumpTo('/', '即将返回首页'); });
      });
      document.querySelectorAll('[data-reader-jump]').forEach(function (button) {
        button.addEventListener('click', function () { jumptochapter(button, button.getAttribute('data-reader-jump')); });
      });
      document.querySelectorAll('[data-reader-drawer-close], [data-reader-close]').forEach(function (button) {
        button.addEventListener('click', function () { setChapterDrawer(false); });
      });
      document.querySelectorAll('[data-reader-drawer]').forEach(function (button) {
        button.addEventListener('click', function () { setChapterDrawer(true); });
      });
      document.querySelectorAll('[data-reader-sort]').forEach(function (button) {
        button.addEventListener('click', clicktochange);
      });
      document.querySelectorAll('[data-reader-mode-toggle]').forEach(function (button) {
        button.addEventListener('click', function (event) {
          event.preventDefault();
          event.stopPropagation();
          toggleReaderMode();
        });
      });
      document.querySelectorAll('[data-reader-setting]').forEach(function (button) {
        button.addEventListener('click', function (event) {
          event.preventDefault();
          event.stopPropagation();
          const setting = document.getElementById('novelReaderSetting');
          if (setting) setReaderSetting(!setting.classList.contains('is-open'));
        });
      });
      document.querySelectorAll('[data-reader-setting-backdrop]').forEach(function (backdrop) {
        backdrop.addEventListener('click', function () { setReaderSetting(false); });
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') setReaderSetting(false);
      });
      document.querySelectorAll('[data-reader-theme]').forEach(function (button) {
        button.addEventListener('click', function () { applyComicReaderTheme(button.getAttribute('data-reader-theme')); });
      });
      document.querySelectorAll('[data-reader-direction]').forEach(function (button) {
        button.addEventListener('click', function (event) {
          event.preventDefault();
          event.stopPropagation();
          applyComicReaderDirection(button.getAttribute('data-reader-direction'));
        });
      });
      const widthRange = document.getElementById('novelFontRange');
      if (widthRange) {
        widthRange.addEventListener('input', function () { applyComicImageWidth(widthRange.value); });
      }
      const favButton = document.getElementById('favbutton');
      if (favButton) {
        favButton.addEventListener('click', function () {
          if (typeof checkFavButtonSelected === 'function') checkFavButtonSelected();
        });
      }
      const commentButton = document.getElementById('commentbutton');
      if (commentButton) {
        commentButton.addEventListener('click', openComments);
      }
      document.querySelectorAll('[data-comment-compose]').forEach(function (button) {
        button.addEventListener('click', function () {
          if (window.TibiuCommentDrawer && typeof TibiuCommentDrawer.openComposerFromTrigger === 'function') {
            TibiuCommentDrawer.openComposerFromTrigger(button);
          } else if (typeof replybuttonpush === 'function') {
            replybuttonpush(button);
          } else if (typeof commentwindow === 'function') {
            commentwindow(true);
          }
        });
      });
      document.querySelectorAll('[data-comment-list-close]').forEach(function (button) {
        button.addEventListener('click', function () { setCommentListDrawer(false); });
      });
      document.querySelectorAll('[data-comment-close]').forEach(function (button) {
        button.addEventListener('click', function () {
          if (typeof commentwindow === 'function') commentwindow(false);
          const commentButton = document.getElementById('commentbutton');
          const commentDrawer = document.getElementById('comicReaderComments');
          if (commentButton && !(commentDrawer && commentDrawer.classList.contains('is-open'))) {
            commentButton.classList.remove('is-active');
          }
        });
      });
      const sendButton = document.querySelector('.sendbutton1');
      if (sendButton) {
        sendButton.addEventListener('click', function () { submitcomment(sendButton); });
      }
      const emojiButton = document.getElementById('emojibutton');
      if (emojiButton) {
        emojiButton.addEventListener('click', checkEmojiButtonSelected);
      }
      const cleanButton = document.querySelector('.cleanbutton');
      if (cleanButton) {
        cleanButton.addEventListener('click', function () {
          if (window.TibiuUI && typeof TibiuUI.confirm === 'function') {
            TibiuUI.confirm({
              headline: '温馨提示',
              description: '确定要清除本地漫画缓存吗？',
              confirmText: '确定',
              cancelText: '取消',
              onConfirm: clearComicLocalStorage
            });
          } else {
            clearComicLocalStorage();
          }
        });
      }
      document.querySelectorAll('.full-screen-scale').forEach(function (button) {
        button.addEventListener('click', function (event) {
          event.preventDefault();
          event.stopPropagation();
          toggleComicReaderFullscreen();
        });
      });

      document.addEventListener('click', function (event) {
        if (!event.target.closest('#maincomiccontainer')) return;
        if (event.target.closest('a,button,input,textarea,select')) return;
        setToolsHidden(!readerBody().classList.contains('is-tools-hidden'));
      });

      if (typeof ckeckComicIsFav === 'function') ckeckComicIsFav();
      if (window.TibiuCommentReactionCache && typeof TibiuCommentReactionCache.ensureSynced === 'function') {
        TibiuCommentReactionCache.ensureSynced().then(function () {
          if (typeof fetchcommentData === 'function') fetchcommentData();
        });
      } else if (typeof fetchcommentData === 'function') {
        fetchcommentData();
      }
      if (typeof createEmojiTabs === 'function') createEmojiTabs();
      if (typeof initComicHorizontalPaging === 'function') initComicHorizontalPaging();
      watchReaderAdOverlays();
      if (typeof loadEmojis === 'function' && window.emojiGroups) {
        const firstGroup = Object.keys(emojiGroups)[0];
        if (firstGroup) loadEmojis(firstGroup, document.querySelector('#emoji-tabs .tab-button'));
      }
      chapterget().then(chapterdirectlink);
      comicget().then(comicinfointo);
      getChapterPicData().then(picinto).catch(function (error) {
        if (window.TibiuChapterAccess && typeof TibiuChapterAccess.show === 'function') {
          TibiuChapterAccess.show(error, { mode: 'initial' });
        }
      });
      fetchData('/index.php/api/hits/comic?id=' + window.comicbasicData.comicid);
      fetchData('/index.php/api/rend/read?type=comic&pid=1&did=' + window.comicbasicData.comicid + '&cid=' + window.comicbasicData.chapterid);
    });
  })();
</script>
