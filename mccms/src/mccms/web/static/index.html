<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mccms 验证前端</title>
<style>
  :root{
    --bg:#111318; --panel:#181b22; --panel2:#1f232c; --line:#2a2f3a;
    --fg:#e6e9ef; --muted:#8b93a3; --accent:#4c8dff; --accent2:#7c5cff;
    --ok:#2fbf71; --warn:#e8a33d; --err:#ef5350;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--fg)}
  a{color:inherit;text-decoration:none}
  button,input,select{font:inherit;color:inherit}

  header{position:sticky;top:0;z-index:20;background:rgba(17,19,24,.92);backdrop-filter:blur(8px);
         border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
  .logo i{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .grow{flex:1}
  .pill{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .pill.on{color:var(--ok);border-color:rgba(47,191,113,.4)}
  .pill.off{color:var(--muted)}
  select,.input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none}
  select:focus,.input:focus{border-color:var(--accent)}
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--accent);color:#fff}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:600}
  .btn.primary:hover{filter:brightness(1.1)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .tabs{display:flex;gap:6px;padding:12px 18px 0;flex-wrap:wrap}
  .tab{padding:6px 14px;border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:none;cursor:pointer;color:var(--muted)}
  .tab.active{background:var(--panel);border-color:var(--line);color:var(--fg)}

  main{padding:16px 18px 60px;max-width:1500px;margin:0 auto}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .toolbar .input{flex:1;min-width:220px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .card .cover{position:relative;aspect-ratio:3/4;background:var(--panel2);overflow:hidden}
  .card .cover img{width:100%;height:100%;object-fit:cover;display:block}
  .card .cover .badge{position:absolute;left:6px;top:6px;font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(0,0,0,.65)}
  .card .body{padding:8px 10px 10px}
  .card .title{font-weight:600;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
  .card .sub{color:var(--muted);font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .detail{display:grid;grid-template-columns:230px 1fr;gap:22px}
  @media(max-width:760px){.detail{grid-template-columns:1fr}}
  .detail .cover img{width:100%;border-radius:12px;border:1px solid var(--line)}
  .detail h2{margin:0 0 8px;font-size:20px}
  .meta{color:var(--muted);font-size:13px;margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap}
  .desc{color:#c3c9d6;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-height:150px;overflow:auto;white-space:pre-wrap}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px}

  .chap-head{display:flex;align-items:center;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
  .chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;max-height:460px;overflow:auto;padding-right:4px}
  .chap{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13px}
  .chap:hover{border-color:var(--accent)}
  .chap .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chap .acc{font-size:11px;padding:1px 6px;border-radius:5px;background:rgba(47,191,113,.15);color:var(--ok);white-space:nowrap}
  .chap .acc.vip{background:rgba(232,163,61,.15);color:var(--warn)}

  .reader-img{width:100%;max-width:900px;margin:0 auto 10px;display:block;border-radius:8px;background:var(--panel2);min-height:120px}
  .reader-bar{position:sticky;top:57px;z-index:10;background:rgba(17,19,24,.92);backdrop-filter:blur(8px);
              border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  .toast{position:fixed;right:18px;bottom:18px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:min(460px,92vw)}
  .toast div{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);
             border-radius:8px;padding:10px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:in .18s ease}
  .toast div.err{border-left-color:var(--err)} .toast div.ok{border-left-color:var(--ok)} .toast div.warn{border-left-color:var(--warn)}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .empty{color:var(--muted);text-align:center;padding:48px 10px}
  .loading{color:var(--muted);text-align:center;padding:28px}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--accent);
        border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .progress{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:8px}
  .progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:width .2s}
  code{background:var(--panel2);padding:1px 6px;border-radius:5px;font-size:12px;word-break:break-all}
  .hidden{display:none!important}
</style>
</head>
<body>

<header>
  <div class="logo"><i></i>mccms 验证前端</div>
  <select id="site" title="站点"></select>
  <div class="grow"></div>
  <span class="pill off" id="userPill">未登录</span>
  <button class="btn" id="btnHome">首页/搜索</button>
</header>

<div class="tabs" id="tabs">
  <div class="tab active" data-mode="search">搜索</div>
  <div class="tab" data-mode="ranking">榜单</div>
  <div class="tab" data-mode="update">最近更新</div>
  <div class="tab" data-mode="hot">热门</div>
</div>

<main>
  <div id="view-list">
    <div class="toolbar">
      <input class="input" id="keyword" placeholder="输入关键字后回车搜索（如：魔咒 / love）">
      <button class="btn primary" id="btnSearch">搜索</button>
      <select id="rankType" class="hidden"></select>
    </div>
    <div id="listResult"><div class="empty">选择站点后开始搜索，或切换到「榜单 / 更新 / 热门」</div></div>
  </div>

  <div id="view-detail" class="hidden"></div>
  <div id="view-reader" class="hidden"></div>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let SITES = [], CURRENT = { site: 'tibiu', mode: 'search', comic: null, chapter: null, nav: [] };

/* ------------------------------------------------------------------ 基础 */

function toast(msg, type = '', ms = 4200) {
  const n = el('div', type, msg);
  $('#toast').appendChild(n);
  setTimeout(() => n.remove(), ms);
}

async function api(path, params = {}, post = null) {
  const qs = new URLSearchParams(
    Object.fromEntries(Object.entries(params).filter(([, v]) => v !== undefined && v !== null && v !== '')));
  const url = `/api/${path}` + (qs.toString() ? `?${qs}` : '');
  const opt = post ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(post) } : {};
  const res = await fetch(url, opt);
  return res.json();
}

function showError(payload) {
  if (payload.category === 'access_denied') {
    toast(`<b>无权限访问</b><br>${esc(payload.message)}<br><span style="color:var(--muted)">${esc(payload.hint || '')}</span>`, 'warn', 9000);
  } else {
    toast(`<b>${esc(payload.error_type || '错误')}</b><br>${esc(payload.message)}`, 'err', 8000);
  }
  console.warn('API error:', payload);
}

const imgProxy = (site, url, scrambleN) =>
  `/api/image?site=${encodeURIComponent(site)}&url=${encodeURIComponent(url)}`
  + (scrambleN > 1 ? `&scramble_n=${scrambleN}` : '');

/* ------------------------------------------------------------------ 路由 */

function show(view) {
  ['list', 'detail', 'reader'].forEach(v => $(`#view-${v}`).classList.toggle('hidden', v !== view));
  $('#tabs').classList.toggle('hidden', view !== 'list');
  window.scrollTo({ top: 0 });
}

/* ------------------------------------------------------------------ 列表 */

function comicCard(item) {
  const card = el('div', 'card');
  const cover = el('div', 'cover');
  if (item.cover) {
    const im = el('img');
    im.loading = 'lazy';
    im.src = imgProxy(CURRENT.site, item.cover);
    im.onerror = () => im.remove();
    cover.appendChild(im);
  }
  if (item.serialize) cover.appendChild(el('span', 'badge', esc(item.serialize)));
  card.appendChild(cover);

  const body = el('div', 'body');
  body.appendChild(el('div', 'title', esc(item.name || '(无标题)')));
  const sub = [item.author, item.latest_chapter].filter(Boolean).join(' · ') || '—';
  body.appendChild(el('div', 'sub', esc(sub)));
  card.appendChild(body);

  card.onclick = () => openComic(item.id);
  return card;
}

function renderList(payload) {
  const box = $('#listResult');
  box.innerHTML = '';
  if (!payload.items || payload.items.length === 0) {
    box.appendChild(el('div', 'empty', '没有结果'));
    return;
  }
  const head = el('div', 'meta', `共 ${payload.items.length} 条` +
    (payload.total ? ` · 站点报告约 ${payload.total} 条` : '') + ` · 第 ${payload.page || 1} 页`);
  box.appendChild(head);
  const grid = el('div', 'grid');
  payload.items.forEach(it => grid.appendChild(comicCard(it)));
  box.appendChild(grid);
}

async function loadList() {
  const box = $('#listResult');
  const site = CURRENT.site;
  box.innerHTML = '<div class="loading"><span class="spin"></span>加载中…</div>';

  let payload;
  if (CURRENT.mode === 'search') {
    const kw = $('#keyword').value.trim();
    if (!kw) { box.innerHTML = '<div class="empty">请输入关键字</div>'; return; }
    payload = await api('search', { site, keyword: kw, page: 1 });
  } else if (CURRENT.mode === 'ranking') {
    payload = await api('ranking', { site, type: $('#rankType').value || 'top', page: 1 });
  } else if (CURRENT.mode === 'update') {
    payload = await api('update', { site, page: 1 });
  } else {
    payload = await api('hot', { site, page: 1 });
  }

  if (!payload.ok) { box.innerHTML = ''; showError(payload); return; }
  renderList(payload);
}

/* ------------------------------------------------------------------ 详情 */

async function openComic(comicId) {
  show('detail');
  const box = $('#view-detail');
  box.innerHTML = '<div class="loading"><span class="spin"></span>加载漫画详情…</div>';

  const payload = await api('comic', { site: CURRENT.site, id: comicId });
  if (!payload.ok) { box.innerHTML = '<div class="empty">加载失败</div>'; showError(payload); return; }

  CURRENT.comic = payload.comic;
  renderComic(payload.comic);
}

function renderComic(comic) {
  const box = $('#view-detail');
  box.innerHTML = '';

  const wrap = el('div', 'detail');
  const left = el('div');
  if (comic.cover) {
    const c = el('div', 'cover');
    const im = el('img');
    im.src = imgProxy(CURRENT.site, comic.cover);
    im.onerror = () => im.remove();
    c.appendChild(im);
    left.appendChild(c);
  }
  wrap.appendChild(left);

  const right = el('div');
  right.appendChild(el('h2', '', esc(comic.name)));
  right.appendChild(el('div', 'meta',
    `<span>作者：${esc(comic.author || '—')}</span>` +
    `<span>状态：${esc(comic.serialize || '—')}</span>` +
    `<span>话数：${comic.chapter_count}</span>` +
    (comic.views ? `<span>人气：${comic.views}</span>` : '') +
    `<span>站点：${esc(comic.site)}</span>`));
  if (comic.tags && comic.tags.length) {
    const tags = el('div', 'tags');
    comic.tags.forEach(t => tags.appendChild(el('span', 'tag', esc(t))));
    right.appendChild(tags);
  }
  if (comic.description) right.appendChild(el('div', 'desc', esc(comic.description)));
  wrap.appendChild(right);
  box.appendChild(wrap);

  const head = el('div', 'chap-head');
  head.appendChild(el('b', '', `章节列表（${comic.chapter_count}）`));
  const filter = el('input', 'input');
  filter.placeholder = '过滤章节名…';
  filter.style.maxWidth = '240px';
  head.appendChild(filter);
  const freeOnly = el('button', 'btn', '只看免费');
  head.appendChild(freeOnly);
  box.appendChild(head);

  const list = el('div', 'chapters');
  box.appendChild(list);

  let onlyFree = false;
  function draw() {
    const kw = filter.value.trim().toLowerCase();
    list.innerHTML = '';
    const chapters = (CURRENT.comic.chapters || []).filter(c =>
      (!kw || (c.name || '').toLowerCase().includes(kw)) && (!onlyFree || c.is_free));
    if (!chapters.length) { list.appendChild(el('div', 'empty', '没有匹配的章节')); return; }
    chapters.forEach(c => {
      const item = el('div', 'chap');
      item.appendChild(el('span', 'name', `${c.index}. ${esc(c.name)}`));
      item.appendChild(el('span', 'acc' + (c.is_free ? '' : ' vip'), esc(c.access)));
      item.onclick = () => openChapter(c.id, c.comic_id || comic.id);
      list.appendChild(item);
    });
  }
  filter.oninput = draw;
  freeOnly.onclick = () => { onlyFree = !onlyFree; freeOnly.textContent = onlyFree ? '显示全部' : '只看免费'; draw(); };
  draw();
}

/* ------------------------------------------------------------------ 阅读器 */

async function openChapter(chapterId, comicId) {
  show('reader');
  const box = $('#view-reader');
  box.innerHTML = '<div class="loading"><span class="spin"></span>加载章节图片…</div>';

  const payload = await api('chapter', { site: CURRENT.site, id: chapterId, comic_id: comicId });
  if (!payload.ok) {
    box.innerHTML = `<div class="panel"><b>无法读取该章节</b><div class="meta" style="margin-top:8px">${esc(payload.message || '')}</div>
      <div style="color:var(--muted);font-size:13px">${esc(payload.hint || '')}</div></div>`;
    showError(payload);
    return;
  }

  CURRENT.chapter = payload.chapter;
  renderReader(payload.chapter, comicId);
}

function renderReader(chapter, comicId) {
  const box = $('#view-reader');
  box.innerHTML = '';

  const bar = el('div', 'reader-bar');
  const back = el('button', 'btn', '← 返回');
  back.onclick = () => CURRENT.comic ? show('detail') : show('list');
  bar.appendChild(back);
  bar.appendChild(el('b', '', `${esc(chapter.comic_name || '')} · ${esc(chapter.name)}`));
  bar.appendChild(el('span', 'pill', `${chapter.image_count} 张 · ${esc(chapter.access)}`));

  const limitSel = el('select');
  [['0', '全部'], ['3', '前 3 张'], ['10', '前 10 张'], ['30', '前 30 张']]
    .forEach(([v, t]) => {
      const o = el('option', '', t);
      o.value = v;
      limitSel.appendChild(o);
    });
  bar.appendChild(limitSel);

  const dl = el('button', 'btn primary', '下载本章');
  bar.appendChild(dl);
  box.appendChild(bar);

  const progressBox = el('div', 'panel hidden');
  box.appendChild(progressBox);

  dl.onclick = async () => {
    dl.disabled = true;
    progressBox.classList.remove('hidden');
    progressBox.innerHTML = '<span class="spin"></span>正在提交下载任务…';

    const res = await api('download', {}, {
      site: CURRENT.site,
      chapter_id: chapter.id,
      comic_id: comicId || chapter.comic_id,
      limit: Number(limitSel.value) || 0,
    });
    if (!res.ok) { dl.disabled = false; progressBox.classList.add('hidden'); showError(res); return; }

    const jobId = res.job.id;
    const total = res.job.total_images || chapter.image_count || 0;

    const timer = setInterval(async () => {
      const j = await api('job', { id: jobId });
      if (!j.ok) { clearInterval(timer); dl.disabled = false; showError(j); return; }
      const job = j.job;
      const pct = total ? Math.min(100, Math.round((job.done_images || 0) / total * 100)) : 0;
      progressBox.innerHTML =
        `<b>下载中</b> <span class="pill">${job.done_images || 0}${total ? ' / ' + total : ''}</span>
         <div class="progress"><i style="width:${pct}%"></i></div>`;

      if (job.status !== 'running') {
        clearInterval(timer);
        dl.disabled = false;
        if (job.status === 'done') {
          const r = job.result;
          progressBox.innerHTML =
            `<b style="color:var(--ok)">下载完成</b> <span class="pill on">${r.image_count} 张</span>
             <div class="meta" style="margin-top:6px">保存到 <code>${esc(r.save_path)}</code>
             ${r.duration ? ` · 耗时 ${r.duration.toFixed(2)}s` : ''}</div>`;
          toast(`下载完成：${r.image_count} 张 → <code>${esc(r.save_path)}</code>`, 'ok', 6000);
        } else if (job.status === 'denied') {
          progressBox.innerHTML =
            `<b style="color:var(--warn)">无权限</b><div class="meta" style="margin-top:6px">${esc(job.error)}</div>
             <div style="color:var(--muted);font-size:13px">本工具不会绕过访问控制；如需访问请配置你自己的账号。</div>`;
          toast(`<b>无权限</b><br>${esc(job.error)}`, 'warn', 9000);
        } else {
          progressBox.innerHTML = `<b style="color:var(--err)">下载失败</b>
            <div class="meta" style="margin-top:6px">${esc(job.error_type || '')}: ${esc(job.error)}</div>`;
          toast(`下载失败：${esc(job.error)}`, 'err', 8000);
        }
      }
    }, 700);
  };

  if (!chapter.images || !chapter.images.length) {
    box.appendChild(el('div', 'empty', '该章节没有返回图片'));
    return;
  }

  const holder = el('div');
  box.appendChild(holder);
  const scrambleN = chapter.scramble_n || 0;
  if (scrambleN > 1) {
    bar.appendChild(el('span', 'pill', `已还原竖带 ${scrambleN}`));
  }
  chapter.images.forEach(img => {
    const n = el('img', 'reader-img');
    n.loading = 'lazy';
    n.src = imgProxy(CURRENT.site, img.url, scrambleN);
    n.alt = img.filename;
    n.title = `${img.index}. ${img.filename}`;
    n.onerror = () => { n.replaceWith(el('div', 'empty', `第 ${img.index} 张加载失败：${esc(img.filename)}`)); };
    holder.appendChild(n);
  });
}

/* ------------------------------------------------------------------ 站点与初始化 */

async function loadSites() {
  const res = await api('sites');
  if (!res.ok) { showError(res); return; }
  SITES = res.sites;

  const sel = $('#site');
  sel.innerHTML = '';
  SITES.forEach(s => {
    const o = el('option', '', `${esc(s.name)} (${s.key})`);
    o.value = s.key;
    sel.appendChild(o);
  });
  sel.value = CURRENT.site;
  sel.onchange = () => { CURRENT.site = sel.value; applyCapabilities(); refreshUser(); loadList(); };
  applyCapabilities();

  // 榜单类型
  const nav = await api('ranknav', { site: CURRENT.site });
  const rankSel = $('#rankType');
  rankSel.innerHTML = '';
  (nav.nav && nav.nav.length ? nav.nav : [{ type: 'top', name: '人气榜' }])
    .forEach(n => {
      const o = el('option', '', esc(n.name));
      o.value = n.type;
      rankSel.appendChild(o);
    });
}

function applyCapabilities() {
  const site = SITES.find(s => s.key === CURRENT.site) || {};
  const cap = site.capabilities || {};
  $('#tabs').querySelector('[data-mode="ranking"]').classList.toggle('hidden', !cap.ranking);
  $('#tabs').querySelector('[data-mode="hot"]').classList.toggle('hidden', !cap.hot);
  if ((CURRENT.mode === 'ranking' && !cap.ranking) || (CURRENT.mode === 'hot' && !cap.hot)) {
    CURRENT.mode = 'search';
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === 'search'));
  }
  $('#rankType').classList.toggle('hidden', CURRENT.mode !== 'ranking');
}

async function refreshUser() {
  const res = await api('user', { site: CURRENT.site });
  const pill = $('#userPill');
  if (!res.ok) { pill.textContent = '用户态未知'; pill.className = 'pill off'; return; }
  const info = res.info || {};
  if (res.logged_in) {
    pill.textContent = `已登录：${info.nichen || info.id || ''}`;
    pill.className = 'pill on';
  } else {
    pill.textContent = '游客（未登录）';
    pill.className = 'pill off';
  }
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    CURRENT.mode = tab.dataset.mode;
    $('#rankType').classList.toggle('hidden', CURRENT.mode !== 'ranking');
    show('list');
    loadList();
  };
});

$('#btnSearch').onclick = () => { show('list'); loadList(); };
$('#keyword').onkeydown = e => { if (e.key === 'Enter') { show('list'); loadList(); } };
$('#btnHome').onclick = () => { show('list'); };
$('#rankType').onchange = () => loadList();

(async function init() {
  await loadSites();
  await refreshUser();
  toast('前端已就绪。搜索或切换标签开始验证。', 'ok', 3500);
})();
</script>
</body>
</html>
