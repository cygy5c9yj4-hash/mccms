# =====================================================================================
# mccms 示例配置：TIBIU 站点（cache.tibiu.net）
#
# TIBIU 是纯 JSON API 站点，本配置文件覆盖了该站点的常用能力。
# 用法：
#   option = mccms.create_option_by_file('assets/option/option_tibiu.yml')
#   option.download_comic('17001')
#   # 或命令行：mccms -o assets/option/option_tibiu.yml 17001
#
# 账号占位符：下面 login 插件用的是 ${MCCMS_USERNAME} / ${MCCMS_PASSWORD} 环境变量写法
# （插件 kwargs 会展开 ${ENV_VAR}）；你也可以直接写成自己的账号字面值。
# 本库只访问公开内容与「当前会话本身有权访问的内容」，不包含任何绕过访问控制的实现。
# =====================================================================================

# 彩色日志，便于在终端观察下载进度
log: pretty

dir_rule:
  # Bd=根目录, Cname=漫画名, Chindextitle=「第N话 章节名」
  rule: Bd_Cname_Chindextitle
  base_dir: ./downloads/tibiu
  normalize_zh: null          # 装了 zhconv 后可填 'zh-cn'（繁转简）或 'zh-tw'（简转繁）

download:
  cache: true                 # 已存在的图片直接跳过，方便断点续传
  image:
    decode: true              # 保留参数：TIBIU 图片明文直出，当前不做任何变换
    suffix: null              # 例：'.jpg' 可把 webp 统一存成 .jpg（仅改后缀名）
  threading:
    image: 16                 # 图片并发，酌情调低以免触发风控
    chapter: 4                # 章节并发

client:
  impl: tibiu

  retry_times: 3

  # 留空 [] 表示使用内置域名 cache.tibiu.net；
  # 若你有自建/镜像域名，可写成 domain: ["your-mirror.example.com"]
  domain: []

  # 账号：填了就自动登录（仅用于访问该账号有权访问的内容）。
  # 也可以在 plugins.after_init 里用 login 插件，两种方式二选一。
  username: null
  password: null

  # TIBIU 的限制级内容需要先确认年龄门；置 true 会在新建 client 时调用 confirm_adult()
  confirm_adult: false

  # 也可以直接用 cookie 复用登录态（留空则不带 cookie）
  # cookies:
  #   PHPSESSID: '你的会话值'

  postman:
    meta_data:
      timeout: 20
      proxies: null
      # impersonate: chrome    # 装了 curl-cffi 时可开启浏览器 TLS 指纹伪装

plugins:
  dependencies_strategy: failed-fast

  # after_init 在 McOption 构造阶段触发，适合放 login / 日志过滤 / 路径替换这类插件
  after_init:
    # ---- 用自己的账号登录（默认关闭；需要时取消注释）--------------------------------
    # 效果：登录成功后把会话 cookie 写回 option，后续新建的 client 复用登录态。
    # 仅用于访问该账号本身有权访问的内容，本库不做任何越权尝试。
    # 取消注释前请先 export MCCMS_USERNAME / MCCMS_PASSWORD
    # （未设置环境变量时构造 option 会打印一条「未配置环境变量」日志，这是正常的）。
    #
    #  - plugin: login
    #    kwargs:
    #      username: ${MCCMS_USERNAME}
    #      password: ${MCCMS_PASSWORD}
    #    log: true
    #    safe: true

  # ---- 可选：只保留自己关心的日志 topic -----------------------------------------
  #  - plugin: log_topic_filter
  #    kwargs:
  #      whitelist: ['plugin', 'comic', 'chapter']

  # 下载整本时，先把封面存下来（会记入 result.manifest.export_filepath_dict）
  # 提示：给 download_cover 传 dir_rule 时，文件名完全由 dir_rule 决定，
  #       想要 .jpg 后缀就要在规则里写出来（如 {Cname}.jpg）。
  after_comic:
    - plugin: download_cover
      kwargs:
        dir_rule: {rule: 'Bd/{Cname}.jpg', base_dir: ./downloads/tibiu/_cover}
        size: ''               # 预留参数：TIBIU 只提供一张封面图

  # ---- 可选：整本打包 zip -------------------------------------------------------
  #  - plugin: zip
  #    kwargs:
  #      zip_dir: ./downloads/tibiu/_zip
  #      filename_rule: Cname
  #      suffix: zip
  #      delete_original_file: false
