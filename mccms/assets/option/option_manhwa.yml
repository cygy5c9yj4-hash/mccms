# =====================================================================================
# mccms 示例配置：漫蛙站点（www.manhwa.wang）
#
# 漫蛙是「JSON + HTML 混合」站点：
#   - 漫画详情 / 搜索 / 分类 走 HTML 页面解析
#   - 章节列表 走 JSON /index.php/api/comic/chapter
#   - 章节图片：免费章节直接从阅读页 HTML 里取；受限章节走 /index.php/api/comic/isbuy
# 因此本配置的并发可以稍微放大一点，但仍然建议保守，避免触发风控。
#
# 用法：
#   option = mccms.create_option_by_file('assets/option/option_manhwa.yml')
#   option.download_comic('mozhouweixianzaoyu')     # 漫蛙的 comic_id 可以是 slug
#   # 或命令行：mccms -o assets/option/option_manhwa.yml mozhouweixianzaoyu
#
# 本库只访问公开内容与「当前会话本身有权访问的内容」，不包含任何绕过访问控制的实现。
# =====================================================================================

log: true

dir_rule:
  # 漫蛙的章节名一般自带「第N话」，Chindextitle 会原样保留，不会重复加序号前缀
  rule: Bd_Cname_Chindextitle
  base_dir: ./downloads/manhwa
  normalize_zh: null

download:
  cache: true
  image:
    decode: true              # 保留参数：漫蛙图片同样是明文直出
    suffix: null
  threading:
    image: 8
    chapter: 4

client:
  impl: manhwa
  retry_times: 3

  # 漫蛙的 HTML 页面偶尔会换域名，可在这里显式指定：
  #   domain: ["www.manhwa.wang"]
  domain: []

  # 需要登录才能看的章节，请填「你自己的」账号（留空则不自动登录）
  username: null
  password: null

  # 也可以直接带 cookie（更常见：从浏览器复制自己的会话 cookie）
  # 说明：其余配置项里的 ${ENV} 不会被展开，只有 dir_rule.base_dir 和插件 kwargs 会。
  #       想用环境变量提供 cookie，请用 CLI 的 --cookie，或在代码里 option.update_cookies({...})。
  # cookies:
  #   PHPSESSID: '你的会话值'

  postman:
    meta_data:
      timeout: 20
      proxies: null
      headers: null
      # impersonate: chrome    # 装了 curl-cffi 时可开启

plugins:
  dependencies_strategy: failed-fast

  # 每话下载完立刻打包成 zip（配合 cache: true，重复下载时 zip 会按需重建）
  after_chapter:
    - plugin: zip
      kwargs:
        zip_dir: ./downloads/manhwa/_zip
        filename_rule: Chindextitle
        suffix: zip
        delete_original_file: false
      log: true
      safe: true

  # ---- 可选：整本打包（放在 after_comic 时是「一本一个 zip」）---------------------
  # after_comic:
  #   - plugin: zip
  #     kwargs:
  #       zip_dir: ./downloads/manhwa/_zip
  #       filename_rule: Cname

  # ---- 可选：图片太少的章节跳过（漫蛙偶尔有只有 1~2 张图的提示页）----------------
  # before_chapter:
  #   - plugin: skip_chapter_with_few_images
  #     kwargs:
  #       at_least_image_count: 3
