# =====================================================================================
# mccms 示例配置：CI / 批量下载工作流（option_workflow.yml）
#
# 设计目标：
#   1. 关闭日志（CI 里日志噪音大），只在需要排查时改回 true / pretty
#   2. 高并发 + 更多重试
#   3. 下载完自动打包 zip，便于作为构建产物上传（GitHub Actions artifact 等）
#   4. 账号 / 目录 / 打包路径全部用 ${环境变量} 占位，避免把凭据写进仓库
#
# 用法（本地或 CI）：
#   export MCCMS_DOWNLOAD_DIR="$PWD/downloads/ci"
#   export MCCMS_ZIP_DIR="$PWD/downloads/ci_zip"
#   export MCCMS_USERNAME='你的账号'
#   export MCCMS_PASSWORD='你的密码'
#   mccms -o assets/option/option_workflow.yml 17001 17002
#   # 也可以一次传多个 id（CLI 会逐个下载），或在代码里用 download_batch：
#   #   mccms.download_batch(mccms.download_comic, ['17001', '17002'], option)
#
# ⚠ ${ENV} 展开范围（源码事实，务必注意）：
#   本库只有两个位置会展开 ${ENV_VAR}：
#     a. dir_rule.base_dir
#     b. 插件 kwargs 中的字符串值
#   所以下面用 login 插件的 ${MCCMS_USERNAME}/${MCCMS_PASSWORD} 传账号是可行的；
#   而 client.cookies 里写 ${...} 不会被展开（会按字面量发出去）。
#   需要 cookie 时请用：CLI --cookie name=value，或代码
#   option.update_cookies({'PHPSESSID': os.environ['MCCMS_PHPSESSID']})。
#
# ⚠ 本库只访问公开内容与「当前会话本身有权访问的内容」；请只下载你有权访问的内容。
# =====================================================================================

log: false                      # CI 环境关闭日志；排查问题时改成 true 或 pretty

dir_rule:
  rule: Bd_Cname_Chindextitle
  base_dir: ${MCCMS_DOWNLOAD_DIR}   # 必须设置该环境变量，否则构造 option 会报「未配置环境变量」
  normalize_zh: null

download:
  cache: true                   # CI 重跑时跳过已下载的图片
  image:
    decode: true                # 保留参数，当前不生效
    suffix: null
  threading:
    image: 32
    chapter: 8

client:
  impl: tibiu                   # 漫蛙工作流把这里改成 manhwa 即可
  retry_times: 5
  domain: []
  confirm_adult: false

  # 账号二选一：
  #   1) 用 plugins.after_init 的 login 插件（本文件采用，支持 ${ENV}）
  #   2) 在这里写 username/password（不支持 ${ENV}，需要自己先做替换）
  username: null
  password: null

  postman:
    meta_data:
      timeout: 30
      proxies: null
      # cookies 用 ${ENV} 占位。⚠ 注意：本库只在 dir_rule.base_dir 与插件 kwargs 里展开 ${ENV}，
      # client.cookies 不会展开，直接写 ${...} 会被当成字面量发出去。
      # CI 里推荐先用 envsubst 渲染整个文件（此时文件里所有 ${VAR} 都会被替换）：
      #     envsubst < assets/option/option_workflow.yml > option.resolved.yml
      #     mccms -o option.resolved.yml 17001
      # 或者干脆用命令行：mccms --cookie "PHPSESSID=$MCCMS_PHPSESSID" 17001
      cookies: {}
      # cookies:
      #   PHPSESSID: ${MCCMS_PHPSESSID}

plugins:
  dependencies_strategy: ignore-only-log   # CI 里缺少可选依赖时只告警，不中断

  after_init:
    - plugin: login
      kwargs:
        username: ${MCCMS_USERNAME}
        password: ${MCCMS_PASSWORD}
      log: true
      safe: false               # CI 中登录失败应当直接失败，避免产出空结果

  after_comic:
    - plugin: zip
      kwargs:
        zip_dir: ${MCCMS_ZIP_DIR}
        filename_rule: Cname
        suffix: zip
        delete_original_file: false
        # encrypt: {password: '${MCCMS_ZIP_PASSWORD}'}   # 加密打包需要 pyzipper
      log: true
      safe: true
