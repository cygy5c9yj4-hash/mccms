<script>
    (function () {
        var navLinks = document.querySelectorAll('.tibiu-site-topbar-link[data-nav-key]');
        if (!navLinks.length) {
            return;
        }
        var homeLink = document.querySelector('.tibiu-site-topbar-link[data-nav-key="home"]');
        var bookLink = document.querySelector('.tibiu-site-topbar-link[data-nav-key="book"]');
        var communityLink = document.querySelector('.tibiu-site-topbar-link[data-nav-key="community"]');
        var articleLink = document.querySelector('.tibiu-site-topbar-link[data-nav-key="article"]');

        function normalizePath(path) {
            var value = String(path || '').replace(/index\.php$/i, '').replace(/\/+$/, '');
            return value === '' ? '/' : value;
        }

        function getLinkPath(link) {
            if (!link) {
                return '/';
            }
            var anchor = document.createElement('a');
            anchor.href = link.getAttribute('href') || '';
            return normalizePath(anchor.pathname);
        }

        function detectNavKey() {
            var bodyKey = document.body ? (document.body.getAttribute('data-nav-key') || '') : '';
            var currentPath = normalizePath(window.location.pathname);
            var homePath = getLinkPath(homeLink);
            var bookPath = getLinkPath(bookLink);
            var communityPath = getLinkPath(communityLink);
            var articlePath = getLinkPath(articleLink);
            if (bodyKey) {
                return bodyKey;
            }
            if (currentPath === homePath) {
                return 'home';
            }
            if (currentPath === bookPath || currentPath.indexOf(bookPath + '/') === 0) {
                return 'book';
            }
            if (currentPath === communityPath) {
                return 'community';
            }
            if (currentPath === articlePath || currentPath.indexOf(articlePath + '/') === 0) {
                return 'article';
            }
            return '';
        }

        function syncNavState() {
            var activeKey = detectNavKey();
            navLinks.forEach(function (link) {
                link.classList.toggle('is-active', link.getAttribute('data-nav-key') === activeKey);
            });
        }

        syncNavState();
        window.addEventListener('hashchange', syncNavState);
    })();
</script>

      '</div>' +
      '<p class="tibiu-discovery-tags">' + formattedTags + '</p>' +
      '<div class="tibiu-discovery-meta"><span>周点击 ' + (comment.zhits || 0) + '</span>' + authorMeta + adultTag + '</div>' +
    '</div>' +
    '<div class="tibiu-discovery-arrow">›</div>' +
  '</div>';
}

function fetchcategoryData(options) {
  const loadOptions = options || {};
  const requestToken = ++discoveryRequestToken;
  renderDiscoverySkeleton(6);
  var categoryurl = '//' + window.location.hostname + '/index.php/api/data/update_api' + window.location.search;
  fetch(categoryurl)
    .then(response => response.json())
    .then(data => {
      if (requestToken !== discoveryRequestToken) return;
      responseData = Array.isArray(data.data) ? data.data : [];
      const tagname = document.getElementById('tagname');
      const tagfname = document.getElementById('tagfname');
      const comicListContainer = document.getElementById('pageofcate240114');

      tagfname.innerHTML = data.fname || '[tagList]';
      tagname.innerHTML = data.name || '[tagName]';

      getElementById('c-1').innerHTML = nav2.create(data.page, data.total_pages);
      document.title = (data.name || '[tagName]') + '漫画更新列表-第' + data.page + '页 - TIBIU漫画在线';

      if (responseData.length === 0) {
        renderEmptyState('当天暂无更新内容');
        return;
      }

      comicListContainer.innerHTML = '';
      let startnum = (data.page - 1) * data.per_page + 1;
      responseData.forEach(comment => {
        comicListContainer.insertAdjacentHTML('beforeend', buildDiscoveryCard(comment, startnum));
        startnum++;
      });
      syncDiscoveryControls();
      if (!loadOptions.silentSuccess) {
        showNotification('success', '数据加载成功');
      }
    })
    .catch(() => {
      if (requestToken !== discoveryRequestToken) return;
      renderEmptyState('加载失败，请稍后重试');
      showNotification('error', '数据加载失败');
    });
}

var getElementById = function(id) {
  return document.getElementById(id);
};

var nav2 = new PageNavigator({
  moreText: '…',
  size: 5,
  numberHelper: `<a onclick="URLParams('update', 'page', '{{page}}')" data-page="{{page}}" class="fig-109s8n4 e1642jms1">{{page}}</a>`,
  currentHelper: `<a onclick="URLParams('update', 'page', '{{page}}')" data-page="{{page}}" class="fig-1y5qzww e1642jms1">{{page}}</a>`,
  prevHelper: `<button onclick="URLParams('update', 'page', '{{page}}')" data-link="{{link}}" class="fig-1a2neb2 fig-left" data-page="{{page}}"><span class="fig-106wouo">${window.TibiuIcon.render('back', { className: 'ti-icon--btn ti-icon--md fig-tran', color: '#787878' })}</span></button>`,
  prevDisabledHelper: `<button class="fig-1a2neb2 fig-left" data-page="{{page}}"><span class="fig-106wouo">${window.TibiuIcon.render('back', { className: 'ti-icon--btn ti-icon--md fig-tran', color: '#e6e6e6' })}</span></button>`,
  nextHelper: `<button onclick="URLParams('update', 'page', '{{page}}')" data-link="{{link}}" class="fig-1a2neb2 fig-right" data-page="{{page}}"><span class="fig-106wouo">${window.TibiuIcon.render('next', { className: 'ti-icon--btn ti-icon--md fig-1r2j9qz', color: '#787878' })}</span></button>`,
  nextDisabledHelper: `<button class="fig-1a2neb2 fig-right" data-page="{{page}}"><span class="fig-106wouo">${window.TibiuIcon.render('next', { className: 'ti-icon--btn ti-icon--md fig-1r2j9qz', color: '#e6e6e6' })}</span></button>`
});

function getQueryParam(param) {
  const urlParams = new URLSearchParams(window.location.search);
  const value = urlParams.get(param);
  return value === null || value === '' ? '0' : value;
}

function getUpdateDayValue() {
  const currentValue = getQueryParam('addtime');
  if (currentValue !== '0') {
    return currentValue;
  }
  return updateDayOptions.length ? updateDayOptions[0].value : '';
}

function getCurrentUpdateDayOption() {
  const currentValue = getUpdateDayValue();
  return updateDayOptions.find(function(option) {
    return option.value === currentValue;
  }) || updateDayOptions[0] || { value: '', label: '全部日期' };
}

function syncUpdateDayToggle() {
  const toggleValue = document.getElementById('updateDayToggleValue');
  if (!toggleValue) return;
  toggleValue.textContent = getCurrentUpdateDayOption().label;
}

function syncDiscoveryControls() {
  syncUpdateDayToggle();
}

function softReloadDiscovery(nextURL, options) {
  const loadOptions = options || {};
  const targetURL = nextURL instanceof URL ? nextURL : new URL(nextURL || window.location.href);
  if (targetURL.href !== window.location.href) {
    window.history.pushState({ tibiuDiscovery: true }, '', targetURL.href);
  }
  syncDiscoveryControls();
  fetchcategoryData({
    silentSuccess: loadOptions.silentSuccess !== false
  });
}

function setDiscoveryFullscreen(active) {
  const button = document.getElementById('toggleFullscreen240112');
  if (!button) return;
  const shell = button.closest('.tibiu-section-shell');
  if (!shell) return;
  shell.classList.toggle('is-discovery-fullscreen', active);
  document.body.classList.toggle('is-discovery-fullscreen', active);
  button.setAttribute('aria-pressed', active ? 'true' : 'false');
  button.setAttribute('aria-label', active ? '退出全屏' : '切换全屏');
  const icon = button.querySelector('ti-icon');
  if (icon) {
    icon.setAttribute('name', active ? 'fullscreenExit' : 'fullscreen');
  }
}

function toggleDiscoveryFullscreen() {
  const button = document.getElementById('toggleFullscreen240112');
  const shell = button ? button.closest('.tibiu-section-shell') : null;
  setDiscoveryFullscreen(!(shell && shell.classList.contains('is-discovery-fullscreen')));
}

function openUpdateDaySelect() {
  if (!updateDayOptions.length) return;
  const currentValue = getUpdateDayValue();
  if (!(window.TibiuModal && typeof window.TibiuModal.select === 'function')) {
    const currentIndex = updateDayOptions.findIndex(function(option) {
      return option.value === currentValue;
    });
    const nextIndex = currentIndex >= 0 ? (currentIndex + 1) % updateDayOptions.length : 0;
    URLParams('update', 'addtime', updateDayOptions[nextIndex].value);
    return;
  }
  window.TibiuModal.select({
    title: '选择更新日期',
    value: currentValue,
    options: updateDayOptions,
    cancelText: '取消',
    confirmText: '确认选择',
    confirmTheme: 'primary',
    showCancel: true,
    confirmOnSelect: true
  }).then(function(option) {
    if (!option || option.value === currentValue) return;
    URLParams('update', 'addtime', option.value);
  });
}

function openFilterModal() {
  fetchFilterMeta().then(function(meta) {
    if (!(window.TibiuModal && typeof window.TibiuModal.open === 'function')) {
      window.alert('当前环境未注入 TibiuModal');
      return;
    }
    filterDraft = getCurrentFilterSelection();
    const modalPromise = window.TibiuModal.open({
      title: '调整更新范围',
      content: renderFilterModal(meta),
      allowHTML: true,
      confirmText: '确定筛选',
      cancelText: '取消',
      confirmTheme: 'primary',
      showCancel: true,
      closeOnOverlay: true,
      closeOnEsc: true,
      onConfirm: applyFilterSelection,
      onClose: function() {
        filterDraft = null;
      }
    });
    window.setTimeout(syncFilterModalSelection, 0);
    return modalPromise;
  }).catch(function() {
    if (window.TibiuAlert && typeof window.TibiuAlert.openStack === 'function') {
      window.TibiuAlert.openStack({
        title: '加载失败',
        content: '筛选条件加载失败，请稍后重试',
        theme: 'danger',
        duration: 2000
      });
    } else {
      window.alert('筛选条件加载失败，请稍后重试');
    }
  });
}

function fetchFilterMeta() {
  if (filterMetaCache) {
    return Promise.resolve(filterMetaCache);
  }
  return withLoading(function() {
    return fetch('//' + window.location.hostname + '/index.php/api/data/filter_options_api?mode=update')
      .then(response => response.json())
      .then(data => {
        if (!data || data.status !== 'success' || !Array.isArray(data.groups)) {
          throw new Error('invalid filter meta');
        }
        filterMetaCache = data;
        return data;
      });
  }, {
    title: '加载筛选',
    content: '正在获取更新筛选项'
  });
}

function getCurrentFilterSelection() {
  return {
    theme: getFilterQueryParam('theme'),
    city: getFilterQueryParam('city'),
    finish: getFilterQueryParam('finish')
  };
}

function getFilterQueryParam(param) {
  const urlParams = new URLSearchParams(window.location.search);
  const value = urlParams.get(param);
  return value === null ? '' : value;
}

function renderFilterModal(meta) {
  return '<div class="tibiu-discovery-filter">' +
    meta.groups.map(group => {
      return '<section class="tibiu-discovery-filter__group">' +
        '<div class="tibiu-discovery-filter__group-title">' + escapeHTML(group.label || '') + '</div>' +
        '<div class="tibiu-discovery-filter__group-grid" data-filter-group="' + escapeHTML(group.key) + '">' +
          group.options.map(option => {
            const value = String(option.value == null ? '' : option.value);
            const active = String((filterDraft && filterDraft[group.key]) || '') === value;
            return '<button type="button" class="tibiu-discovery-filter__option' + (active ? ' is-active' : '') + '" data-filter-key="' + escapeHTML(group.key) + '" data-filter-value="' + escapeHTML(value) + '" aria-pressed="' + (active ? 'true' : 'false') + '">' +
              '<span class="tibiu-discovery-filter__option-icon" aria-hidden="true">' + window.TibiuIcon.render('check', { className: 'ti-icon--btn ti-icon--md', color: '#2196f3' }) + '</span>' +
              '<span class="tibiu-discovery-filter__option-label">' + escapeHTML(option.label || '') + '</span>' +
            '</button>';
          }).join('') +
        '</div>' +
      '</section>';
    }).join('') +
  '</div>';
}

function syncFilterModalSelection() {
  const modal = document.querySelector('.tibiu-modal:last-of-type');
  if (!modal) return;
  const filterRoot = modal.querySelector('.tibiu-discovery-filter');
  if (!filterRoot) return;
  if (!filterRoot.__tibiuFilterBound) {
    filterRoot.__tibiuFilterBound = true;
    filterRoot.addEventListener('click', function(event) {
      const button = event.target.closest('.tibiu-discovery-filter__option');
      if (!button) return;
      const key = button.getAttribute('data-filter-key') || '';
      const value = button.getAttribute('data-filter-value') || '';
      if (!filterDraft) {
        filterDraft = getCurrentFilterSelection();
      }
      filterDraft[key] = value;
      updateFilterModalSelection(filterRoot);
    });
  }

  updateFilterModalSelection(filterRoot);
}

function updateFilterModalSelection(filterRoot) {
  filterRoot.querySelectorAll('[data-filter-group]').forEach(group => {
    const key = group.getAttribute('data-filter-group') || '';
    const activeValue = String((filterDraft && filterDraft[key]) || '');
    group.querySelectorAll('.tibiu-discovery-filter__option').forEach(button => {
      const isActive = (button.getAttribute('data-filter-value') || '') === activeValue;
      button.classList.toggle('is-active', isActive);
      button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
    });
  });
}

function applyFilterSelection() {
  const currentURL = new URL(window.location.href);
  currentURL.searchParams.delete('page');
  ['theme', 'city', 'finish'].forEach(key => {
    const value = String((filterDraft && filterDraft[key]) || '');
    if (value) {
      currentURL.searchParams.set(key, value);
    } else {
      currentURL.searchParams.delete(key);
    }
  });
  softReloadDiscovery(currentURL);
}

function escapeHTML(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function URLParams(action, param, value = null) {
  const currentURL = new URL(window.location.href);
  if (action === 'update') {
    currentURL.searchParams.set(param, value);
  } else if (action === 'delete') {
    currentURL.searchParams.delete(param);
  } else {
    console.error('Invalid action. Use "update" or "delete".');
    return;
  }
  softReloadDiscovery(currentURL);
}

function clickToJump(url, info) {
  if (window.TibiuAlert && typeof window.TibiuAlert.openStack === 'function') {
    window.TibiuAlert.openStack({
      title: '页面跳转',
      content: info,
      theme: 'primary',
      duration: 1200
    });
  } else {
    showNotification('info', info);
  }
  setTimeout(function() {
    window.location.href = url;
  }, 450);
}

document.addEventListener('DOMContentLoaded', function() {
  fetchcategoryData();
  syncUpdateDayToggle();
  const fullscreenButton = document.getElementById('toggleFullscreen240112');
  if (fullscreenButton) {
    fullscreenButton.addEventListener('click', toggleDiscoveryFullscreen);
  }
  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
      setDiscoveryFullscreen(false);
    }
  });
  window.addEventListener('popstate', function() {
    syncDiscoveryControls();
    fetchcategoryData({ silentSuccess: true });
  });
});
</script>
</body>
</html>
