[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mccms"
version = "1.0.0"
description = "Python API for Mccms sites (TIBIU / manhwa.wang) — 架构对齐 JMComic-Crawler-Python"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["mccms", "crawler", "comic", "manhwa", "tibiu", "python-api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.25",
    "pyyaml>=5.4",
    # 图片还原（竖带倒序解码）必需；也是 long_img 插件的基础
    "pillow>=9.0",
]

[project.optional-dependencies]
# 浏览器 TLS 指纹伪装（部分站点在强风控下需要）
impersonate = ["curl-cffi"]
# 插件依赖：zip 加密 / PDF / 长图
plugins = [
    "pyzipper",
    "img2pdf",
    "pikepdf",
]
# 繁简体目录名归一化
zh = ["zhconv"]
dev = [
    "pytest",
]

[project.scripts]
mccms = "mccms.cli:main"
mccms-web = "mccms.web.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
